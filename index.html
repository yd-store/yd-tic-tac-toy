<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Tic Tac Toe - FF Style Room</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      background: #060214;
      color: #fff;
    }

    .screen {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
    }

    /* ---------------- 1. MAIN MENU & MODALS ---------------- */
    #main-menu {
      background: radial-gradient(circle, rgba(45,26,14,0.7) 0%, rgba(15,8,4,0.95) 100%),
                  url('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
    }

    .wood-card {
      background: linear-gradient(145deg, #5c3822, #3e2213);
      border: 3px solid #8d5b37;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.15);
      padding: 25px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      color: #faebd7;
      z-index: 10;
    }

    .wood-card h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: #ffdda1;
      text-shadow: 2px 2px 4px #1a0c02;
      margin-bottom: 20px;
    }

    .wood-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #b86b32, #7a3e12);
      border: 2px solid #e28a45;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #4a2408;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      margin-bottom: 12px;
      user-select: none;
    }

    .wood-btn:hover { background: linear-gradient(180deg, #cf7d3d, #8f4b18); }
    .wood-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a2408; }

    .wood-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #8d5b37;
      background: #251308;
      color: #ffeedb;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 12px;
      outline: none;
    }

    .wood-input::placeholder { color: #a47855; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    /* ---------------- 2. ROOM LOBBY ---------------- */
    #room-lobby-screen {
      display: none;
      background: radial-gradient(circle at center, #1b0f38 0%, #08031a 90%);
      flex-direction: column;
      align-items: center;
    }

    .room-header {
      background: rgba(22, 10, 48, 0.85);
      border: 2px solid #a855f7;
      border-radius: 14px;
      padding: 12px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      z-index: 10;
    }

    .room-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: #ff007f;
      letter-spacing: 1.5px;
    }

    .room-code-tag {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      color: #00f0ff;
      margin-top: 5px;
      cursor: pointer;
      text-decoration: underline;
    }

    .slots-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 440px;
      z-index: 10;
    }

    .slot-card {
      flex: 1;
      min-height: 170px;
      border-radius: 14px;
      background: rgba(20, 10, 40, 0.75);
      border: 2px dashed #6b21a8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
    }

    .slot-card.occupied {
      border: 2px solid #00f0ff;
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .slot-card.occupied-o {
      border: 2px solid #ff0055;
      background: rgba(255, 0, 85, 0.1);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }

    .slot-number {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      color: #a855f7;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
    }

    .slot-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #11052c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 8px;
      border: 2px solid #8b5cf6;
    }

    .slot-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      text-align: center;
      word-break: break-all;
    }

    .slot-status {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      text-align: center;
    }

    .start-btn {
      width: 100%;
      max-width: 320px;
      padding: 13px;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #10b981, #047857);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      z-index: 10;
    }

    .start-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------------- 3. IN-GAME SCREEN ---------------- */
    #game-screen {
      display: none;
      background: radial-gradient(circle at center, #180d38 0%, #060214 80%);
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    #game-screen::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(rgba(147, 51, 234, 0.15) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(147, 51, 234, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
      transform: perspective(300px) rotateX(60deg);
      pointer-events: none !important;
      z-index: 0;
      opacity: 0.5;
    }

    .game-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 10px;
      z-index: 10;
    }

    .voice-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(22, 10, 48, 0.85);
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #a855f7;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #00f0ff;
    }

    .vol-slider {
      width: 55px;
      accent-color: #a855f7;
      cursor: pointer;
    }

    .score-board {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
      z-index: 10;
    }

    .score-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(19, 7, 43, 0.85);
      border: 2px solid transparent;
      padding: 8px 14px;
      border-radius: 12px;
      min-width: 110px;
      transition: all 0.2s;
    }

    .score-card.active-turn {
      border-color: #fff;
      box-shadow: 0 0 15px #fff;
      transform: scale(1.04);
    }

    .score-card.x-side { border-color: #00f0ff; }
    .score-card.o-side { border-color: #ff0055; }

    .p-name {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      max-width: 85px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .p-score {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      margin-top: 2px;
    }

    .x-color { color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }
    .o-color { color: #ff0055; text-shadow: 0 0 8px #ff0055; }

    .board-container {
      position: relative;
      padding: 8px;
      background: rgba(16, 5, 36, 0.9);
      border: 3px solid #b026ff;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(176, 38, 255, 0.5);
      z-index: 10;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 8px;
    }

    .cell {
      border-radius: 12px;
      background: rgba(25, 12, 54, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(176, 38, 255, 0.3);
      position: relative;
      z-index: 12;
    }

    .cell:hover { background: rgba(55, 22, 115, 0.9); }
    .cell:active { background: rgba(70, 30, 140, 0.95); }
    .cell.x { color: #00f0ff; text-shadow: 0 0 12px #00f0ff; }
    .cell.o { color: #ff0055; text-shadow: 0 0 12px #ff0055; }

    .cell.winning-cell {
      background: rgba(255, 255, 255, 0.25) !important;
      animation: pulseWin 0.6s infinite alternate;
    }

    @keyframes pulseWin {
      0% { transform: scale(0.96); box-shadow: 0 0 8px #fff; }
      100% { transform: scale(1.04); box-shadow: 0 0 20px #00f0ff, 0 0 30px #ff0055; }
    }

    .info-text {
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: #c084fc;
      letter-spacing: 1px;
      z-index: 10;
      text-align: center;
      min-height: 20px;
    }

    .game-bottom-area {
      margin-top: 10px;
      width: 100%;
      max-width: 360px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-box {
      background: rgba(14, 5, 33, 0.9);
      border: 1.5px solid #a855f7;
      border-radius: 12px;
      padding: 8px;
      height: 100px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }

    .msg {
      padding: 4px 8px;
      border-radius: 6px;
      max-width: 85%;
      word-break: break-word;
    }
    .msg.me { background: rgba(0, 240, 255, 0.2); border: 1px solid #00f0ff; align-self: flex-end; color: #e0faff; }
    .msg.peer { background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055; align-self: flex-start; color: #ffe4ec; }

    .chat-input-row {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }

    .chat-input-row input {
      flex: 1;
      background: rgba(30, 10, 65, 0.85);
      border: 1px solid #a855f7;
      border-radius: 6px;
      color: #fff;
      padding: 6px 8px;
      font-size: 11px;
      outline: none;
    }

    .action-btn {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
      background: #8b5cf6;
    }
  </style>
</head>
<body>

  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- ================= 1. MAIN MENU ================= -->
  <div id="main-menu" class="screen">
    <div class="wood-card">
      <h1>TIC TAC TOE</h1>
      <button class="wood-btn" onclick="openCreateModal()">Create Room</button>
      <div style="margin: 8px 0; font-weight: bold; color: #d2a679; font-size: 13px;">OR</div>
      <button class="wood-btn" onclick="openJoinModal()">Join Room</button>
    </div>
  </div>

  <!-- CREATE ROOM MODAL -->
  <div id="create-modal" class="modal-overlay">
    <div class="wood-card">
      <h2 style="font-family:'Orbitron'; font-size:18px; margin-bottom:12px; color:#ffdda1;">Create Room</h2>
      <input type="text" id="host-name" class="wood-input" placeholder="Your Nickname" maxlength="10" />
      <input type="password" id="room-pass" class="wood-input" placeholder="Set Room Password" />
      <button class="wood-btn" onclick="submitCreateRoom()">Open Lobby</button>
      <button class="wood-btn" style="background:#55280e; margin-bottom:0;" onclick="closeModals()">Cancel</button>
    </div>
  </div>

  <!-- JOIN ROOM MODAL -->
  <div id="join-modal" class="modal-overlay">
    <div class="wood-card">
      <h2 style="font-family:'Orbitron'; font-size:18px; margin-bottom:12px; color:#ffdda1;">Join Room</h2>
      <input type="text" id="guest-name" class="wood-input" placeholder="Your Nickname" maxlength="10" />
      <input type="text" id="join-code" class="wood-input" placeholder="Room Code (yd-XXXXXX)" />
      <button class="wood-btn" onclick="submitJoinRoom()">Find Room</button>
      <button class="wood-btn" style="background:#55280e; margin-bottom:0;" onclick="closeModals()">Cancel</button>
    </div>
  </div>

  <!-- ================= 2. FF STYLE LOBBY ================= -->
  <div id="room-lobby-screen" class="screen">
    <div class="room-header">
      <h2>CUSTOM BATTLE ROOM</h2>
      <p style="font-size:11px; color:#cbd5e1; margin-top:3px;">Click Code to Copy:</p>
      <div id="lobby-code-display" class="room-code-tag" onclick="copyRoomCode()">yd-??????</div>
    </div>

    <div class="slots-container">
      <div class="slot-card occupied" id="slot-1">
        <span class="slot-number">SLOT 1</span>
        <div class="slot-avatar">👑</div>
        <div class="slot-name" id="slot1-name">Host</div>
        <div class="slot-status" id="slot1-status">READY (Player X)</div>
      </div>

      <div class="slot-card" id="slot-2">
        <span class="slot-number">SLOT 2</span>
        <div class="slot-avatar" id="slot2-avatar">⏳</div>
        <div class="slot-name" id="slot2-name">Waiting...</div>
        <div class="slot-status" id="slot2-status">Open Slot</div>

        <div id="guest-auth-box" style="display:none; margin-top:6px; width:100%;">
          <input type="password" id="entered-pass" class="wood-input" style="padding:6px; font-size:11px; margin-bottom:4px;" placeholder="Password" />
          <button class="wood-btn" style="padding:6px; font-size:10px;" onclick="verifyGuestPassword()">Enter Slot</button>
        </div>
      </div>
    </div>

    <button id="start-btn" class="start-btn" onclick="startGameMatch()" disabled>START GAME</button>
    <button class="wood-btn" style="max-width:180px; background:#ef4444; margin-top:12px; padding:8px; font-size:11px;" onclick="backToMenu()">Quit Room</button>
  </div>

  <!-- ================= 3. IN-GAME SCREEN ================= -->
  <div id="game-screen" class="screen">
    <div class="game-top-bar">
      <div class="voice-controls">
        <button class="icon-btn" id="mic-toggle-btn" onclick="toggleMic()">🎙️</button>
        <span style="font-size:9px; color:#a855f7;">VOL</span>
        <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="1" oninput="setPeerVolume(this.value)" />
      </div>
      <button class="wood-btn" style="padding:4px 8px; font-size:10px; margin:0; width:auto; background:#ef4444;" onclick="backToMenu()">Exit</button>
    </div>

    <div class="score-board">
      <div class="score-card x-side" id="card-x">
        <span class="p-name" id="game-name-x">Player X</span>
        <span class="p-score x-color" id="score-x">0</span>
      </div>
      <div style="font-family:'Orbitron'; font-weight:900; font-size:16px; color:#d8b4fe;">VS</div>
      <div class="score-card o-side" id="card-o">
        <span class="p-name" id="game-name-o">Player O</span>
        <span class="p-score o-color" id="score-o">0</span>
      </div>
    </div>

    <div class="board-container">
      <div class="board">
        <div class="cell" onclick="handleCellClick(0)"></div>
        <div class="cell" onclick="handleCellClick(1)"></div>
        <div class="cell" onclick="handleCellClick(2)"></div>
        <div class="cell" onclick="handleCellClick(3)"></div>
        <div class="cell" onclick="handleCellClick(4)"></div>
        <div class="cell" onclick="handleCellClick(5)"></div>
        <div class="cell" onclick="handleCellClick(6)"></div>
        <div class="cell" onclick="handleCellClick(7)"></div>
        <div class="cell" onclick="handleCellClick(8)"></div>
      </div>
    </div>

    <div class="info-text" id="status-text">YOUR TURN!</div>

    <div class="game-bottom-area">
      <div class="chat-box">
        <div class="messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-txt" placeholder="Message..." onkeydown="if(event.key==='Enter') sendChat()" />
          <button class="wood-btn" style="width:55px; margin:0; padding:4px; font-size:10px; background:#a855f7;" onclick="sendChat()">Send</button>
        </div>
      </div>
      <button class="action-btn" onclick="requestRestart()">Next Round</button>
    </div>
  </div>

  <script>
    /* ================= Web Audio API ================= */
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.15) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    const soundMove = () => playTone(600, 'triangle', 0.1);
    const soundWin = () => {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'sine', 0.2), idx * 100);
      });
    };
    const soundTie = () => playTone(220, 'sawtooth', 0.25);

    /* ================= State Variables ================= */
    let peer = null;
    let conn = null;
    let localStream = null;
    let isMicMuted = false;

    let myName = "Player";
    let myRole = null; 
    let peerName = "Opponent";
    let roomPassword = "";
    let roomCode = "";

    let currentTurn = 'X';
    let board = Array(9).fill(null);
    let scoreX = 0;
    let scoreO = 0;
    let gameActive = false;

    /* ================= Mic & Media ================= */
    async function initMicrophone() {
      if (localStream) return localStream;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        return localStream;
      } catch (e) {
        console.warn("Microphone not available or allowed.");
        return null;
      }
    }

    function toggleMic() {
      if (!localStream) return;
      isMicMuted = !isMicMuted;
      localStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted);
      const btn = document.getElementById('mic-toggle-btn');
      btn.innerText = isMicMuted ? '🔇' : '🎙️';
      btn.style.color = isMicMuted ? '#ef4444' : '#00f0ff';
    }

    function setPeerVolume(val) {
      const audio = document.getElementById('remote-audio');
      audio.volume = parseFloat(val);
    }

    /* ================= Navigation & Modals ================= */
    function openCreateModal() { document.getElementById('create-modal').style.display = 'flex'; }
    function openJoinModal() { document.getElementById('join-modal').style.display = 'flex'; }
    function closeModals() {
      document.getElementById('create-modal').style.display = 'none';
      document.getElementById('join-modal').style.display = 'none';
    }

    function showScreen(screenId) {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('room-lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById(screenId).style.display = 'flex';
    }

    function backToMenu() {
      if (conn) conn.close();
      if (peer) peer.destroy();
      location.reload();
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode).then(() => alert("Copied Code: " + roomCode)).catch(() => {
        prompt("Copy this room code:", roomCode);
      });
    }

    /* ================= Host Connection ================= */
    async function submitCreateRoom() {
      const name = document.getElementById('host-name').value.trim();
      const pass = document.getElementById('room-pass').value.trim();
      if (!name) return alert("Please enter your nickname!");
      if (!pass) return alert("Please set a room password!");

      myName = name;
      roomPassword = pass;
      myRole = 'X';

      await initMicrophone();
      closeModals();

      roomCode = 'yd-' + Math.floor(100000 + Math.random() * 900000);
      peer = new Peer(roomCode);

      peer.on('open', (id) => {
        document.getElementById('lobby-code-display').innerText = id;
        document.getElementById('slot1-name').innerText = myName;
        showScreen('room-lobby-screen');
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupHostConnection();
      });

      peer.on('call', (call) => {
        call.answer(localStream || undefined);
        call.on('stream', stream => {
          document.getElementById('remote-audio').srcObject = stream;
        });
      });

      peer.on('error', (err) => {
        alert("Peer error: " + err.type);
        backToMenu();
      });
    }

    function setupHostConnection() {
      conn.on('data', (data) => {
        if (data.type === 'auth-request') {
          if (data.password === roomPassword) {
            peerName = data.name;
            conn.send({ type: 'auth-success', hostName: myName });
            
            const slot2 = document.getElementById('slot-2');
            slot2.className = 'slot-card occupied-o';
            document.getElementById('slot2-avatar').innerText = '🎮';
            document.getElementById('slot2-name').innerText = peerName;
            document.getElementById('slot2-status').innerText = 'READY (Player O)';
            document.getElementById('start-btn').disabled = false;
          } else {
            conn.send({ type: 'auth-failed', reason: 'Incorrect Password!' });
          }
        } else {
          handleInGameData(data);
        }
      });

      conn.on('close', () => {
        alert("Opponent left!");
        backToMenu();
      });
    }

    /* ================= Guest Connection ================= */
    let tempCode = "";
    async function submitJoinRoom() {
      const name = document.getElementById('guest-name').value.trim();
      const code = document.getElementById('join-code').value.trim();
      if (!name) return alert("Please enter your nickname!");
      if (!code) return alert("Please enter the room code!");

      myName = name;
      tempCode = code;
      myRole = 'O';

      await initMicrophone();
      closeModals();

      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(code, { reliable: true });

        conn.on('open', () => {
          roomCode = code;
          document.getElementById('lobby-code-display').innerText = roomCode;
          document.getElementById('slot2-name').innerText = myName;
          document.getElementById('slot-2').className = 'slot-card occupied-o';
          document.getElementById('slot-2').querySelector('.slot-status').style.display = 'none';
          document.getElementById('guest-auth-box').style.display = 'block';
          showScreen('room-lobby-screen');
          setupGuestConnection();
        });
      });

      peer.on('call', (call) => {
        call.answer(localStream || undefined);
        call.on('stream', stream => {
          document.getElementById('remote-audio').srcObject = stream;
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          alert("Room does not exist! Check the code.");
        } else {
          alert("Error: " + err.type);
        }
        backToMenu();
      });
    }

    function verifyGuestPassword() {
      const pass = document.getElementById('entered-pass').value.trim();
      if (!pass) return alert("Enter the room password!");
      conn.send({ type: 'auth-request', password: pass, name: myName });
    }

    function setupGuestConnection() {
      conn.on('data', (data) => {
        if (data.type === 'auth-success') {
          peerName = data.hostName;
          document.getElementById('slot1-name').innerText = peerName;
          document.getElementById('guest-auth-box').style.display = 'none';
          const slot2Status = document.getElementById('slot2-status');
          slot2Status.style.display = 'block';
          slot2Status.innerText = 'WAITING FOR HOST TO START...';
          
          if (localStream) {
            const call = peer.call(tempCode, localStream);
            call.on('stream', stream => {
              document.getElementById('remote-audio').srcObject = stream;
            });
          }
        } else if (data.type === 'auth-failed') {
          alert(data.reason);
          backToMenu();
        } else if (data.type === 'game-start') {
          launchGame();
        } else {
          handleInGameData(data);
        }
      });

      conn.on('close', () => {
        alert("Host closed the room!");
        backToMenu();
      });
    }

    /* ================= Game Flow ================= */
    function startGameMatch() {
      if (myRole !== 'X') return;
      conn.send({ type: 'game-start' });
      launchGame();
    }

    function launchGame() {
      showScreen('game-screen');
      document.getElementById('game-name-x').innerText = myRole === 'X' ? myName : peerName;
      document.getElementById('game-name-o').innerText = myRole === 'O' ? myName : peerName;
      board = Array(9).fill(null);
      currentTurn = 'X';
      gameActive = true;
      renderBoard();
      updateTurnIndicator();
    }

    function handleInGameData(data) {
      if (data.type === 'move') {
        board[data.index] = data.symbol;
        currentTurn = data.symbol === 'X' ? 'O' : 'X';
        soundMove();
        renderBoard();
        checkGameResult();
      } else if (data.type === 'chat') {
        appendMessage(data.text, 'peer');
      } else if (data.type === 'restart') {
        resetBoard();
      }
    }

    function handleCellClick(index) {
      if (!gameActive || board[index] !== null || currentTurn !== myRole) return;

      board[index] = myRole;
      currentTurn = myRole === 'X' ? 'O' : 'X';
      soundMove();
      renderBoard();
      conn.send({ type: 'move', index: index, symbol: myRole });
      checkGameResult();
    }

    function renderBoard() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        cell.innerText = board[idx] === 'X' ? '✕' : (board[idx] === 'O' ? '○' : '');
        cell.className = 'cell ' + (board[idx] ? board[idx].toLowerCase() : '');
      });
      updateTurnIndicator();
    }

    function updateTurnIndicator() {
      const cardX = document.getElementById('card-x');
      const cardO = document.getElementById('card-o');
      const statusText = document.getElementById('status-text');

      if (!gameActive) return;

      if (currentTurn === 'X') {
        cardX.classList.add('active-turn');
        cardO.classList.remove('active-turn');
      } else {
        cardO.classList.add('active-turn');
        cardX.classList.remove('active-turn');
      }

      if (currentTurn === myRole) {
        statusText.innerText = "YOUR TURN!";
        statusText.style.color = "#00f0ff";
      } else {
        statusText.innerText = "WAITING FOR OPPONENT...";
        statusText.style.color = "#c084fc";
      }
    }

    function checkGameResult() {
      const winCombos = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      for (let combo of winCombos) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          const winner = board[a];
          gameActive = false;
          soundWin();

          const cells = document.querySelectorAll('.cell');
          cells[a].classList.add('winning-cell');
          cells[b].classList.add('winning-cell');
          cells[c].classList.add('winning-cell');

          if (winner === 'X') scoreX++;
          else scoreO++;

          document.getElementById('score-x').innerText = scoreX;
          document.getElementById('score-o').innerText = scoreO;

          const status = document.getElementById('status-text');
          if (winner === myRole) {
            status.innerText = "BOOYAH! YOU WON! 🔥";
            status.style.color = "#10b981";
          } else {
            status.innerText = "DEFEATED! 💀";
            status.style.color = "#ef4444";
          }
          return;
        }
      }

      if (!board.includes(null)) {
        gameActive = false;
        soundTie();
        const status = document.getElementById('status-text');
        status.innerText = "MATCH DRAW! 🤝";
        status.style.color = "#f59e0b";
      }
    }

    function requestRestart() {
      resetBoard();
      if (conn) conn.send({ type: 'restart' });
    }

    function resetBoard() {
      board = Array(9).fill(null);
      currentTurn = 'X';
      gameActive = true;
      const cells = document.querySelectorAll('.cell');
      cells.forEach(c => c.classList.remove('winning-cell'));
      renderBoard();
      updateTurnIndicator();
    }

    /* ================= Chat ================= */
    function sendChat() {
      const input = document.getElementById('chat-txt');
      const msg = input.value.trim();
      if (!msg || !conn) return;

      conn.send({ type: 'chat', text: msg });
      appendMessage(msg, 'me');
      input.value = '';
    }

    function appendMessage(text, type) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'me' ? 'You: ' : `${peerName}: `) + text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
